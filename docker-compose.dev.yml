# Development stack: live reload for the API (:8020) and the Vite dev server (:5173), with its own data volume
# so it never touches the deployed instance. Use:  docker compose -f docker-compose.dev.yml up --build
name: holdover-dev

services:
  api:
    build: { context: ., dockerfile: Dockerfile.dev }
    ports: ["${DEV_API_PORT:-8020}:8000"]
    volumes:
      - ./app:/app/app
      - ./alembic.ini:/app/alembic.ini
      - dev-data:/data
    environment:
      USER_AGENT: ${USER_AGENT:?set USER_AGENT with a contact address}
      # On by default so data does not go stale while you work (same polite polling as the deployed app). To stop it set
      # DEV_RUN_SCHEDULER=false and refresh by hand with scripts/dev-fetch.sh
      RUN_SCHEDULER: ${DEV_RUN_SCHEDULER:-true}
      HOME_LAT: ${HOME_LAT:-}
      HOME_LON: ${HOME_LON:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      ENABLED_ZONES: ${ENABLED_ZONES:-}   # which ODFW zones to fetch and offer (default: willamette,central,northwest)
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-}
      LLM_EXTRACT_MODEL: ${LLM_EXTRACT_MODEL:-}   # optional: a slower, stronger model for the weekly report extraction
      LLM_EXTRACT_TIMEOUT: ${LLM_EXTRACT_TIMEOUT:-}
  web:
    image: node:22-slim
    working_dir: /web
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    ports: ["${DEV_WEB_PORT:-5173}:5173"]
    environment:
      API_URL: http://api:8000
    volumes:
      - ./web:/web
      - web-node-modules:/web/node_modules   # keep Linux modules out of your host checkout
    depends_on: [api]

volumes:
  dev-data:
  web-node-modules:
