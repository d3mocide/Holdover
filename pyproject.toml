[project]
name = "holdover"
version = "0.1.0"
description = "Oregon fishing planner and journal"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "apscheduler>=3.10,<4",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
