[project]
name = "holdover"
version = "0.9.0"
description = "Oregon fishing planner and journal"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "apscheduler>=3.10,<4",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "pydantic-settings>=2.2",
  "astral>=3.2",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
postgres = ["psycopg[binary]>=3.2"]  # optional: run on Postgres instead of SQLite

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["certs/*.pem"]  # the bundled intermediate certificate for the Army Corps host travels with the package

[tool.pytest.ini_options]
testpaths = ["tests"]
